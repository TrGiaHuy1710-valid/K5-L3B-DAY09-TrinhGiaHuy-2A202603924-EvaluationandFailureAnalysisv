sibling_refund: FM-07          # sibling_refund: "gom đơn" ghi tiền dưới claim khác (C-107)
denied_ignored: FM-02          # ignore_denied: host từ chối mà vẫn báo resolved (C-108, C-111)
reply_ledger_mismatch: FM-08   # misreport: reply nói số tiền khác ledger (C-109, C-112)
